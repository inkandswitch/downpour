[workspace]
resolver = "3"
members = [
  "rain_diagram_core",
  "rain_diagram_wasm",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inkandswitch/downpour"
authors = ["Brooklyn Zelenka <hello@brooklynzelenka.com>"]

[workspace.dependencies]
# Internal crates
rain_diagram_core = { version = "0.1.0", path = "rain_diagram_core", default-features = false }

# External crates
arbitrary = "1.4"
bolero = "0.13.4"
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
testresult = "0.4.1"
thiserror = { version = "2.0", default-features = false }
# Pinned exactly: must match the `wasm-bindgen-cli` in the Nix dev shell
wasm-bindgen = { version = "=0.2.130", default-features = false }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }

rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_extern_crates = "deny"

unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
indexing_slicing = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
panic = "warn"
todo = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

# Keep the Wasm name section so panics show function names
[profile.release.package.rain_diagram_wasm]
strip = "debuginfo"

# Property tests: optimized, but with assertions and overflow checks on
[profile.bolero]
inherits = "release"
debug-assertions = true
overflow-checks = true
panic = "unwind"
