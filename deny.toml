# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Alphabetized. Everything must be compatible with Apache-2.0.
allow = ["Apache-2.0", "BSD-2-Clause", "MIT", "Unicode-3.0"]

[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
