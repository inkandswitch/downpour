<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Downpour: shared editor</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
      header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ddd; }
      main { display: grid; grid-template-columns: minmax(320px, 1fr) 2fr; min-height: 0; }
      #source { overflow: auto; border-right: 1px solid #ddd; }
      #source .cm-editor { height: 100%; }
      #picture { overflow: auto; padding: 12px; }
      #status { color: #666; }
    </style>
  </head>
  <body>
    <header>
      <strong>Downpour</strong>
      <span id="status">connecting…</span>
      <a id="share" href="#">share link</a>
    </header>
    <main>
      <div id="source"></div>
      <rain-diagram id="picture" editable></rain-diagram>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
